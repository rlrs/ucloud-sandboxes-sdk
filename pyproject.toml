[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ucloud-sandboxes-sdk"
dynamic = ["version"]
description = "Python SDK and Inspect AI integration for UCloud sandbox gateways"
readme = "README.md"
requires-python = ">=3.10.13"
dependencies = []

[project.optional-dependencies]
async = [
    "aiohttp>=3.10,<4",
]
inspect = [
    "aiohttp>=3.10,<4",
    "inspect-ai>=0.3.240,<0.4",
]

[project.entry-points.inspect_ai]
ucloud_sandboxes = "ucloud_sandboxes_sdk.integrations.inspect"

[tool.hatch.build.targets.wheel]
packages = ["src/ucloud_sandboxes_sdk"]

[tool.hatch.version]
path = "src/ucloud_sandboxes_sdk/__init__.py"

[dependency-groups]
dev = [
    "aiohttp>=3.10,<4",
    "hypothesis>=6,<7",
    "inspect-ai>=0.3.240,<0.4",
    "ruff>=0.12,<1",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.uv]
exclude-newer = "2026-08-07T10:16:55.662849Z"
