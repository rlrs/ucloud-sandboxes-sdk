name: test

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.2"
          enable-cache: true
      - name: Verify the minimal installation
        run: |
          uv sync --locked --no-dev
          uv run --no-dev python -c "import ucloud_sandboxes_sdk"
      - name: Install the complete test environment
        run: uv sync --locked --all-extras
      - name: Lint
        run: uv run --all-extras ruff check src tests
      - name: Test the Inspect-enabled installation
        run: uv run --all-extras python -m unittest
      - name: Build and smoke-test the minimal wheel
        run: |
          uv build --out-dir "$RUNNER_TEMP/sdk-dist"
          uv venv "$RUNNER_TEMP/sdk-venv"
          uv pip install \
            --python "$RUNNER_TEMP/sdk-venv/bin/python" \
            "$RUNNER_TEMP"/sdk-dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/sdk-venv/bin/python" \
            "$GITHUB_WORKSPACE/tests/minimal_install_smoke.py"
